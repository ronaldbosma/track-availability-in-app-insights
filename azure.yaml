# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: track-availability-in-app-insights
metadata:
  template: tdd-track-availability-in-app-insights@1.6.0
services:
  functionApp:
    project: ./src/functionApp/TrackAvailabilityInAppInsights.FunctionApp
    host: function
    language: csharp
  logicApp:
    project: ./src/logicApp
    dist: Workflows
    host: function
    language: logicappsstandard
    customCodeProject: Functions/TrackAvailabilityInAppInsights.LogicApp.Functions.csproj
requiredVersions:
  azd: ">= 1.39.1" # azd version 1.39.1 or higher is required because we're using features from Bicep v0.49.2.
  extensions:
    azure.logicappsstandard: "latest"
